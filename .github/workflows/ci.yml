name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: skinai
          POSTGRES_PASSWORD: skinai
          POSTGRES_DB: skinai_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U skinai" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://skinai:skinai@localhost:5432/skinai_test
      TEST_DATABASE_URL: postgresql://skinai:skinai@localhost:5432/skinai_test
      JWT_ACCESS_SECRET: ci-secret-with-at-least-32-characters-123456
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate --workspace backend
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F5F7F6" />
    <script>
      const systemTheme = window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      let theme = systemTheme;
      try {
        const savedTheme = localStorage.getItem('rotulai-theme');
        if (savedTheme === 'light' || savedTheme === 'dark') theme = savedTheme;
      } catch (error) {
        if (!(error instanceof DOMException && error.name === 'SecurityError')) throw error;
      }
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#121417' : '#F5F7F6';
    </script>
    <meta
      name="description"
      content="Pesquise produtos cosméticos e consulte referências educativas de ingredientes no Rotulai."
    />
    <meta property="og:title" content="Rotulai" />
    <meta property="og:description" content="Catálogo de cosméticos e referência educativa de ingredientes." />
    <meta property="og:type" content="website" />
    <title>Rotulai</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

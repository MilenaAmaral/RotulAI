# Banco PostgreSQL para desenvolvimento local.
# Uso: docker compose up -d db
services:
  db:
    image: postgres:16-alpine
    container_name: skinai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: skinai
      POSTGRES_PASSWORD: skinai
      POSTGRES_DB: skinai
    ports:
      - '5432:5432'
    volumes:
      - skinai-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U skinai -d skinai']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  skinai-pgdata:

# Banco PostgreSQL para desenvolvimento local.
# Uso: docker compose up -d db
services:
  db:
    image: postgres:16-alpine
    container_name: rotulai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rotulai
      POSTGRES_PASSWORD: rotulai
      POSTGRES_DB: rotulai
    ports:
      - '5432:5432'
    volumes:
      - rotulai-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rotulai -d rotulai']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  rotulai-pgdata:
